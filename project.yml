name: MacroDock
options:
  bundleIdPrefix: com.macrodock
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  swift-algorithms:
    url: https://github.com/apple/swift-algorithms
    from: 1.2.0
  Alamofire:
    url: https://github.com/wrandecima-bit/Alamofire
    revision: 7fdd403089757be2ce6991b287c7bef612c8bd04
settings:
  base:
    SWIFT_VERSION: "6.2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  MacroDock:
    type: application
    platform: iOS
    sources:
      - path: MacroDock
    dependencies:
      - package: swift-algorithms
        product: Algorithms
      - package: Alamofire
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.macrodock.harbor
        PRODUCT_NAME: MacroDock
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_CFBundleDisplayName: MacroDock
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_UIColorName: mdk_background
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_NSCameraUsageDescription: MacroDock reads barcodes to check cargo into the pantry manifest.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_TESTABILITY: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        DEVELOPMENT_TEAM: ""
        OTHER_LDFLAGS: ["-lsqlite3"]
  MacroDockTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MacroDockTests
    dependencies:
      - target: MacroDock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.macrodock.harbor.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
schemes:
  MacroDock:
    build:
      targets:
        MacroDock: all
        MacroDockTests: [test]
    test:
      targets:
        - MacroDockTests
